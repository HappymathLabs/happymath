site_name: HappyMath 文档
site_description: HappyMath 数学建模与机器学习库文档
site_author: HappyMathLabs
docs_dir: .
site_dir: ../site

theme:
  name: mkdocs
  highlightjs: true
  hljs_languages:
    - python
    - yaml
    - bash

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_category_heading: true
            show_symbol_type_heading: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            filters:
              - "!^_"
            members_order: source
            inherited_members: true
            show_if_no_docstring: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 安装指南: installation.md
  - 快速开始: quickstart.md
  - 模块教程:
      - AutoML 自动化机器学习: modules/automl.md
      - Decision 多准则决策: modules/decision.md
      - DiffEq 微分方程: modules/diffeq.md
      - Opt 数学优化: modules/opt.md
  - API 参考:
      - happymath 顶层接口: api/happymath.md
      - AutoML: api/automl.md
      - Decision: api/decision.md
      - DiffEq: api/diffeq.md
      - Opt: api/opt.md

extra:
  version: 0.2.0
